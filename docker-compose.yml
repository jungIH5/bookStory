services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:5001
      - DOCKER=true
      # 소셜 로그인 버튼이 쓰는 클라이언트 ID — backend/.env의 KAKAO_CLIENT_ID/NAVER_OAUTH_CLIENT_ID/
      # GOOGLE_CLIENT_ID와 같은 값을 여기에도 넣어야 한다(시크릿이 아니라 공개돼도 되는 클라이언트 ID라
      # 코드에 직접 적어도 안전함 — 카카오 지도 JS 키도 index.html에 같은 방식으로 들어있음). 값을 채워야
      # 소셜 로그인 버튼이 "준비 중입니다" 대신 실제 로그인 페이지로 리다이렉트된다.
      - VITE_KAKAO_CLIENT_ID=
      - VITE_NAVER_CLIENT_ID=
      - VITE_GOOGLE_CLIENT_ID=
    depends_on:
      - agent

  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    # 로컬 개발용 오버라이드: Dockerfile은 프로덕션 기본값으로 비-root 사용자(appuser)를 쓰지만,
    # 여기서는 ./agent를 호스트에서 그대로 바인드 마운트하므로 컨테이너 안 UID가 호스트 파일에
    # 쓰기 권한이 없을 수 있다 — 로컬 전용으로 root로 되돌린다(배포 시 실제 이미지에는 영향 없음).
    user: "root"
    ports:
      - "5001:5001"
    volumes:
      - ./agent:/app
    environment:
      - UVICORN_EXTRA_ARGS=--reload
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=bookstory
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d bookstory"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  db-data:
