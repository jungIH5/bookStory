version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:5001
    depends_on:
      - agent

  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    ports:
      - "5001:5001"
    volumes:
      - ./agent:/app
    env_file:
      - ./backend/.env   # 기존 .env 파일 공유 (키 한 곳에서 관리)

# (Node.js backend는 agent/로 대체됨. 파일은 backend/ 에 보존)

